name: Deploy Pikabu Games version to GitHub Pages

# Pikabu Games does not host builds, so the game it embeds is served from
# https://ironarchier.github.io/pazzle-game/ . Every push to main updates it live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and verify the Pikabu Games version
        run: npm run build:pikabu

      - name: Upload dist-pikabu for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pikabu

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
