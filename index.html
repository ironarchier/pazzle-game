<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pazzle Game</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e2e;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e1e2e;
        transition: opacity 0.4s ease;
      }
      #preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader img {
        width: min(30vw, 30vh, 160px);
        height: auto;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader"><img src="/icon.svg" alt="" /></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
