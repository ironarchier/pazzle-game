<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Аниме-пазлы</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('pazzle-game:settings') || '{}');
        if (settings.theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #eef1f6;
      }
      :root[data-theme='dark'] {
        --bg: #1b1f27;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        transition: opacity 0.4s ease;
      }
      #preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader img {
        width: min(30vw, 30vh, 160px);
        height: auto;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader"><img src="/icon.svg" alt="" /></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
